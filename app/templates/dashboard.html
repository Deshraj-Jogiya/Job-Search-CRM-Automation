<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Career Pilot</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="topbar">
        <h1>Career Pilot</h1>
        <form method="post" action="/settings/automation/toggle" class="inline-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button type="submit" class="{{ 'btn-on' if settings.automation_enabled else 'btn-off' }}">
                Automation: {{ "ON" if settings.automation_enabled else "OFF" }}
            </button>
        </form>
    </header>

    <main>
        <section class="summary-cards">
            <div class="card">
                <span class="card-label">Total Applications</span>
                <span class="card-value">{{ total_applications }}</span>
            </div>
            <div class="card">
                <span class="card-label">Profile Variants</span>
                <span class="card-value">{{ profile_variants|length }}</span>
            </div>
        </section>

        <section class="empty-state">
            <p>Foundation is running. Job intake, tailoring, and the confirmation queue land in the next build phases.</p>
        </section>

        <section class="settings-panel">
            <h2>Tunable Settings</h2>
            <form method="post" action="/settings/update">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                <label>Fast poll interval (minutes)
                    <input type="number" name="fast_poll_interval_minutes" value="{{ settings.fast_poll_interval_minutes }}" min="1">
                </label>

                <label>Full ingest interval (minutes)
                    <input type="number" name="full_ingest_interval_minutes" value="{{ settings.full_ingest_interval_minutes }}" min="1">
                </label>

                <label>Confirmation window (hours)
                    <input type="number" step="0.5" name="confirmation_window_hours" value="{{ settings.confirmation_window_hours }}" min="0.5">
                </label>

                <label>Fast-track score threshold
                    <input type="number" name="fast_track_score_threshold" value="{{ settings.fast_track_score_threshold }}" min="0" max="100">
                </label>

                <label>Fast-track freshness window (minutes)
                    <input type="number" name="fast_track_freshness_minutes" value="{{ settings.fast_track_freshness_minutes }}" min="1">
                </label>

                <label>Fast-track confirmation window (hours)
                    <input type="number" step="0.5" name="fast_track_window_hours" value="{{ settings.fast_track_window_hours }}" min="0.1">
                </label>

                <label>Rejected job retention (days)
                    <input type="number" name="rejected_retention_days" value="{{ settings.rejected_retention_days }}" min="1">
                </label>

                <label>Daily outreach cap
                    <input type="number" name="daily_outreach_cap" value="{{ settings.daily_outreach_cap }}" min="0">
                </label>

                <button type="submit">Save Settings</button>
            </form>
        </section>
    </main>
</body>
</html>
