# Declarative resume-generation rules (Part C). Consumed by
# app/services/resume_rules.py, applied to the EXISTING tailoring
# pipeline (tailoring_service.py) and profile-variant system
# (profile_service.py) -- not a new generator. Every key here is
# validated on load, with a documented default and an allowed
# range/type -- see resume_rules.py's validate() for the exact checks.
# Hot-reloadable: edit this file and the next resume generation picks
# it up, no restart needed.

experience_classification:
  # A role counted as full "Experience" (not folded into the combined
  # "Earlier:" line) needs at least this many months.
  experience_min_months: 6
  # A role older than this many months (measured from its end date, or
  # from now if still current) also folds into "Earlier:" even if it
  # cleared the min-months bar -- keeps the resume focused on recent work.
  experience_recency_months: 36
  # Two experience entries whose date ranges overlap by more than this
  # many days get "(concurrent)" appended to the later-listed one.
  concurrent_overlap_days: 60

skills:
  max_skill_items_total: 32
  max_skill_lines: 5
  # Default category order -- a skill not matching any group name
  # below renders in the display order it was already in.
  #
  # These must be the real profile's raw skill-category KEYS (e.g.
  # "generative_ai_llms_agentic_frameworks"), not the humanized display
  # labels -- docx_generator._add_skills_section matches this list
  # against resume_doc["skills"]'s own dict keys directly, and only
  # humanizes for display afterward (_humanize_skill_category). The
  # previous version of this list ("Data Engineering", "Cloud &
  # Warehouses", etc.) never matched any real key, so it silently did
  # nothing -- every category still rendered (there are exactly 5 real
  # categories and max_skill_lines is 5), just in whatever order the
  # profile JSON happened to store them in, not by deliberate choice.
  groups:
    - "generative_ai_llms_agentic_frameworks"
    - "machine_learning_deep_learning"
    - "data_engineering_cloud_platforms"
    - "full_stack_software_engineering"
    - "devops_tooling_analytics"

metrics:
  # How many bare (unhedged) percentage/multiplier claims are allowed
  # per page before the rest get hedged regardless of verified status
  # -- keeps a resume from reading like a wall of identical-looking
  # bold claims even when every one of them is individually true.
  max_bare_percentages_per_page: 2
  # Exact percentage/multiplier substrings confirmed real by the user
  # -- anything found in a bullet that ISN'T in this list renders
  # hedged ("roughly"/"approximately"/"about"/"~"). Scope figures
  # (counts, row volumes, uptime) are exempt from hedging entirely,
  # see resume_rules.py -- this list is only for percentages/multipliers.
  # Populated 2026-09-11: every bare percentage/multiplier confirmed
  # real across the full profile (experience + projects), per the
  # user directly -- was an empty list before, so every one of these
  # was getting defensively hedged into "approximately X%" past the
  # 2-per-page cap even though all of them are true.
  verified_metrics:
    - "12%"
    - "15%"
    - "17%"
    - "20%"
    - "25%"
    - "30%"
    - "33%"
    - "35%"
    - "40%"
    - "45%"
    - "50%"
    - "60%"
    - "65%"
    - "70%"
    - "88%"
    - "90%"
    - "92%"
    - "94%"
    - "98%"
    - "99.20%"
    - "99.9%"
    - "100%"
    - "+3%"
    - "+10%"
    - "+150%"
    - "-35%"
    - "-40%"

projects_by_variant:
  max_projects: 3
  bullets_per_project_min: 1
  bullets_per_project_max: 2
  # Each slug is resume_rules._slugify() applied to the real project's
  # "name" field in the live profile (config/resume_rules.yaml has no
  # way to reference a project except by its own slugified title --
  # select_projects_for_variant never invents a project, a slug with no
  # matching real project is simply skipped). Corrected 2026-09-11 to
  # match the real, current profile project titles (verified against a
  # golden-fixture pull from production, see tests/fixtures/golden/) --
  # the shorter slugs this held before assumed project names that had
  # since changed. If a project's name changes again, its slug here
  # needs to change with it, or it silently drops out of that variant.
  variants:
    # "default" is what actually renders today -- the only real
    # ProfileVariant row in production is named "Default", which
    # doesn't slugify to any of the other named keys below, so every
    # tailored resume generated so far has used THIS list (or, before
    # this key existed, the undocumented positional fallback in
    # tailoring_service.py -- first 3 projects in raw profile order,
    # not by relevance). The other named variants only take effect if
    # a matching ProfileVariant is created on the Profile page (e.g.
    # "ML Engineering", "Analytics", "Full Stack").
    default:
      - job_search_crm_ai_application_tailoring_center
      - talentvenue_eventintel_enterprise_data_platform_predictive_intelligence
      - ai_model_observability_fairness_audits
    data_engineering:
      - job_search_crm_ai_application_tailoring_center
      - talentvenue_eventintel_enterprise_data_platform_predictive_intelligence
      - ai_model_observability_fairness_audits
    ml_ai:
      - ai_model_observability_fairness_audits
      - job_search_crm_ai_application_tailoring_center
      - ml_apprentice_take_home_exercise_sentence_transformer_multi_task_learning
    analytics:
      - sales_analytics_rfm_customer_segmentation_pipeline
      - tax_anomaly_audit_compliance_engine
      - elevateme_bootcamp_customer_segmentation_marketing_intelligence
    # Recreated 2026-09-11 -- a "Full Stack & Software Engineering"
    # project filter existed on the portfolio site before an earlier
    # rebuild dropped it; this is the CRM-side equivalent so a "Full
    # Stack" ProfileVariant can pull the right 3 projects.
    full_stack:
      - job_search_crm_ai_application_tailoring_center
      - chef_at_gathering
      - get_your_token

work_authorization:
  # Turned on 2026-09-14 at the candidate's explicit direction. The text
  # is deliberately precise: F-1 STEM OPT means NO employer action is
  # needed to hire right now (real EAD, works like any other employee) --
  # H-1B only becomes relevant later, to continue past OPT. Getting that
  # distinction stated accurately is the point; a vaguer line risks being
  # misread as "needs sponsorship now" and screened out for the wrong
  # reason. work_authorization_line() never infers this text -- it only
  # ever returns exactly what's written here, so this is the one place
  # that can ever change what the resume says about immigration status.
  include_work_auth_line: true
  work_auth_text: "Authorized to work in the U.S. now under F-1 STEM OPT (no employer action required to hire); will require H-1B sponsorship to continue beyond OPT."

certifications:
  # Added 2026-09-14 at the candidate's explicit direction ("build the
  # resume that stands out"): a 3+ years candidate listing 5
  # certifications where 3 are beginner-level online-course completions
  # reads as padding, not strength. Curates the RESUME only -- nothing
  # is hidden from the full profile, LinkedIn, or portfolio, which can
  # and do show the complete real history. select_certifications_for_resume()
  # never invents or drops a real one outside this cap; a priority key
  # with nothing matching is just skipped.
  max_shown: 3
  priority:
    - "Guinness World Record"    # genuinely rare, verifiable, memorable -- lead with it
    - "Tableau"                  # real, recognized credential body, directly relevant to data roles
    - "Generative AI"            # relevant to the AI/ML specialization

page_fit:
  # Corrected 2026-09-11 when b1.1 was actually built: the PDF
  # renderer's real, already-shipped body font (document_render_service.py's
  # _body_style/_bullet_style) is 8.7pt, tuned over many prior sessions
  # of real density debugging -- a 9.0pt "floor" written before that was
  # ever checked would be ABOVE the current starting value, making
  # shrink_body_font_one_step a no-op from the first render. The floor
  # now sits genuinely below the real starting font.
  min_body_font_pt: 8.0
  min_margin_in: 0.35
  max_pages: 1
  # Step sizes for the three visual reductions (b1.1) -- how much one
  # application of each moves the corresponding render parameter.
  line_spacing_step_pt: 0.3
  margin_step_in: 0.05
  font_step_pt: 0.3
  # shorten_summary's budget when the summary has no clear sentence
  # break to trim to instead (see page_fit_service._shorten_summary_text).
  summary_shorten_max_chars: 160
  # Ordered by ascending aggressiveness -- b1.1's fit loop tries them in
  # this order the FIRST time it ever runs (before it has any learned
  # history), picking whichever untried reduction currently has the
  # best content_value_weight / measured_lines_saved ratio once history
  # exists (see resume_rules.py / adaptation_service.py's page-fit
  # learning). Never touches Summary structure beyond shortening it,
  # Education, or an entry's first bullet -- enforced in code, not just
  # by ordering here.
  reduction_catalog:
    - id: tighten_line_spacing
      content_value_weight: 1
    - id: shrink_margins_one_step
      content_value_weight: 2
    - id: drop_weakest_bullet_per_role
      content_value_weight: 4
    - id: shrink_body_font_one_step
      content_value_weight: 3
    - id: shorten_summary
      content_value_weight: 2
    - id: drop_third_project
      content_value_weight: 5
