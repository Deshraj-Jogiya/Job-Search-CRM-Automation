[pytest]
testpaths = tests
# Locally this worked by accident (running via `python -m pytest` adds
# the cwd to sys.path automatically) -- CI invokes the bare `pytest`
# command instead, which doesn't, and failed with `ModuleNotFoundError:
# No module named 'app'` the first time this ran for real. Explicit
# beats implicit: this makes `app` importable regardless of how pytest
# is invoked.
pythonpath = .
