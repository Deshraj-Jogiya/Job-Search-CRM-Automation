name: Dependency Audit

on:
  schedule:
    - cron: "0 6 * * 1"  # weekly, Monday 06:00 UTC -- new CVEs land continuously; a one-time manual run (Phase 21) goes stale
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab too

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project dependencies
        run: pip install -r requirements-lock.txt

      # pip-audit itself isn't a runtime dependency (see CLAUDE.md's
      # Phase 21 note on why it was removed from requirements-lock.txt
      # after the original manual audit) -- installed fresh here, in an
      # isolated CI run, so it never pollutes the real lockfile.
      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit
